name: Release

# release-please maintains a release PR (package.json + manifest.json
# version bump and CHANGELOG.md) from Conventional Commit history.
# Merging that PR creates the vX.Y.Z tag; the publish job below then
# uploads it to the store (same-run job, so the GITHUB_TOKEN event
# suppression does not apply).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
