name: Release

# release-please maintains a release PR (package.json + manifest.json
# version bump and CHANGELOG.md) from Conventional Commit history.
# Merging that PR creates the vX.Y.Z tag, which triggers publish.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
