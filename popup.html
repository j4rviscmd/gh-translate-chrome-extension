<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <button id="toggle-translate" class="primary">Translate</button>

  <div class="row">
    <select id="source-language" aria-label="Source language"></select>
    <span class="arrow">&rarr;</span>
    <select id="target-language" aria-label="Target language"></select>
  </div>

  <label class="row">
    <input type="checkbox" id="auto-translate">
    <span>Auto-translate on page load</span>
  </label>

  <fieldset>
    <legend>Areas</legend>

    <div class="category">
      <div class="category-title">Issues</div>
      <label class="row"><input type="checkbox" data-page="issue" data-area="title"><span>Title</span></label>
      <label class="row"><input type="checkbox" data-page="issue" data-area="body"><span>Body &amp; comments</span></label>
      <label class="row"><input type="checkbox" data-page="issue" data-area="list"><span>List titles</span></label>
    </div>

    <div class="category">
      <div class="category-title">Pull requests</div>
      <label class="row"><input type="checkbox" data-page="pull" data-area="title"><span>Title</span></label>
      <label class="row"><input type="checkbox" data-page="pull" data-area="body"><span>Body &amp; comments</span></label>
      <label class="row"><input type="checkbox" data-page="pull" data-area="list"><span>List titles</span></label>
    </div>

    <div class="category">
      <div class="category-title">README</div>
      <label class="row"><input type="checkbox" data-page="readme" data-area="body"><span>Content</span></label>
    </div>
  </fieldset>

  <label class="row">
    <input type="checkbox" id="helper-toggle">
    <span>Show input helper button</span>
  </label>

  <div id="status" class="status" hidden></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
